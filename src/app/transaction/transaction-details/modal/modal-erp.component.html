
<div mat-dialog-actions>
  @if(fileName !== '' && fileName !== 'NA')
  {
  <div>
  <textarea matInput rows="20" cols="80"  style="font-size: small; width: 100%;  line-height: 20px; "
    [(ngModel)]="erpData"></textarea>
    </div>


    <label>FileName:</label>
    <input type="text" style="font-size: small; width: 80%;" [(ngModel)]="fileName">

  <button class="btn btn-primary"  cdkFocusInitial (click)="save()">Save</button>
  <button style="margin-left: 10px;" (click)="onCloseClick()" >Close</button>

  }
  @else {
    <label style=" margin-right:10px; margin-left:10px;">File not found</label>
  }
</div>
